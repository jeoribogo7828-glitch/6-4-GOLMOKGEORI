<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6-4 골목거리 | 우리말 탐험</title>
<style>
:root{font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif;color:#183d36;background:#f1f6f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1020px;margin:auto;padding:22px 18px 64px}header{background:#125446;color:white;padding:25px 0}header .wrap{padding:0 18px}h1{font-size:clamp(26px,4vw,38px);margin:4px 0 8px}h2{margin:0 0 14px;font-size:24px}h3{margin:10px 0}p{line-height:1.65}.eyebrow{letter-spacing:.12em;font-size:12px;font-weight:800;color:#c6e4d7}.sub{color:#d8ebe5}nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.tab{border:1px solid #c9d8cf;background:white;color:#286356;padding:11px 14px;border-radius:13px;font-weight:800;cursor:pointer}.tab.on{background:#145d4b;color:white}.card{border:1px solid #d9e5dc;background:white;padding:25px;border-radius:20px;box-shadow:0 4px 15px #153d2710;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.shop{border:2px solid #d9e5dc;border-radius:15px;padding:19px;text-align:center;background:#fbfdfb;cursor:pointer;color:#234d40}.shop.selected{border-color:#15755d;background:#e9f8ef}.emoji{font-size:38px;display:block;margin-bottom:10px}.shop strong{display:block;font-size:19px}.muted{color:#667c70;font-size:14px}.pill{display:inline-block;background:#def2e7;color:#175e4d;border-radius:100px;padding:6px 12px;font-size:13px;font-weight:800}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea,select{font:inherit;border:1.5px solid #c6d6ca;border-radius:11px;padding:12px;width:100%;color:#183d36;background:white}textarea{min-height:80px;resize:vertical}input:focus,textarea:focus,select:focus{outline:3px solid #a6dfc3;border-color:#278969}.word{padding:15px;border:1px solid #deebe1;border-radius:13px;margin-top:12px}.word h3{margin:0 0 5px}.button{border:0;border-radius:12px;background:#176c56;color:white;font-size:16px;font-weight:800;padding:12px 18px;cursor:pointer}.button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e8f2eb;color:#145744}.warn{background:#fff5e2;border:1px solid #f4d69f;border-radius:13px;padding:12px;color:#694d1f}.steps{display:flex;gap:8px;margin-bottom:15px}.steps div{flex:1;height:7px;background:#d9e5df;border-radius:20px}.steps .done{background:#20846b}.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.planrow{padding:17px;border:1px solid #dde9e1;border-radius:14px;margin-bottom:14px}.sample{background:#f0f8f3;border-radius:14px;padding:15px;margin-top:10px}.result{border:1px solid #cddbd0;border-radius:20px;padding:24px;background:#fffcf4}.result h2{text-align:center;font-size:34px}.result .slogan{text-align:center;font-size:19px}.result .illustration{border:2px dashed #ccdacd;border-radius:14px;min-height:115px;display:grid;place-items:center;text-align:center;padding:20px;color:#55756a}.result .blurb{border-top:1px solid #d9e2d6;margin-top:20px;padding-top:12px}a{color:#096a51}small{line-height:1.6}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}.hidden{display:none!important}.footer{font-size:13px;color:#667d70;text-align:center;padding:20px}.note{font-size:13px;color:#687e71}.label-num{display:inline-block;background:#236b54;color:white;padding:4px 10px;border-radius:40px;margin-right:8px}ul{line-height:1.8} @media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}.choice{grid-template-columns:1fr}.card{padding:18px}h2{font-size:21px}}@media print{header,nav,.actions,.noprint,.footer{display:none!important}.wrap{padding:0}.card{border:0;box-shadow:none;padding:0}.result{break-inside:avoid}}
</style></head>
<body><header><div class="wrap"><div class="eyebrow">우리말 탐험 프로젝트</div><h1>🏘️ 6-4 골목거리</h1><div class="sub">고유어를 조사하고, 우리 공간을 소개해요!</div></div></header>
<main class="wrap"><div class="row"><span class="pill" id="status">1 / 5 단계</span><span class="muted">입력 내용은 현재 기기에 자동 저장돼요.</span></div><nav id="nav"></nav><div class="steps" id="progress"></div><div id="content"></div><div class="footer">6-4 골목거리 · 학급 수업용 프로그램 · 실제 온라인 제출 및 기기 간 공유는 지원하지 않아요.</div></main>
<script>
const shops=[{id:'flower',name:'꽃집',icon:'💐',words:['꽃망울','꽃내음','꽃다발','꽃잎','새싹','꽃송이']},{id:'food',name:'음식점',icon:'🍚',words:['비빔밥','불고기','수제비','누룽지','반찬','국물']},{id:'book',name:'책방',icon:'📚',words:['글귀','책갈피','이야기','길잡이','줄거리','글씨']},{id:'clothes',name:'옷가게',icon:'👕',words:['옷매무새','맵시','무늬','옷깃','바느질','옷자락']},{id:'play',name:'놀이터',icon:'🛝',words:['그네','미끄럼틀','숨바꼭질','술래','놀이','팽이']},{id:'rest',name:'쉼터',icon:'🌳',words:['그늘','나무','바람','햇살','오솔길','풀밭']},{id:'demo',name:'도서관 (교사 시범)',icon:'📖',words:['나래','꿈','이야기','글귀','길잡이','책갈피']}];
const labels=['공간 선택','고유어 조사','고유어 선택','전단지 계획','결과 확인'];
const key='golmokgeori_v1';
const initial=()=>({step:0,shop:'',team:'',meanings:{},examples:{},choices:['','',''],reasons:['','',''],uses:['','',''],picture:'',pictureReason:''});
let data=initial();try{const s=JSON.parse(localStorage.getItem(key));if(s&&typeof s==='object')data={...initial(),...s}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shop(){return shops.find(s=>s.id===data.shop)}
function canNext(){if(data.step===0)return !!shop();if(data.step===1)return shop().words.every(w=>(data.meanings[w]||'').trim());if(data.step===2)return data.choices.every(Boolean)&&new Set(data.choices).size===3&&data.reasons.every(x=>x.trim());if(data.step===3)return data.uses.every(x=>x.trim())&&data.picture.trim()&&data.pictureReason.trim();return true}
function setStep(n){data.step=n;save();render();scrollTo({top:0,behavior:'smooth'})}
function field(name,value){data[name]=value;save()}
function dict(){window.open('https://opendict.korean.go.kr/main','_blank','noopener')}
function render(){document.getElementById('status').textContent=`${data.step+1} / 5 단계`;document.getElementById('nav').innerHTML=labels.map((x,i)=>`<button class="tab ${i===data.step?'on':''}" data-step="${i}">${i+1}. ${x}</button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setStep(Number(b.dataset.step)));document.getElementById('progress').innerHTML=labels.map((_,i)=>`<div class="${i<=data.step?'done':''}"></div>`).join('');let html='';if(data.step===0)html=step0();if(data.step===1)html=step1();if(data.step===2)html=step2();if(data.step===3)html=step3();if(data.step===4)html=step4();document.getElementById('content').innerHTML=html+`<div class="actions noprint"><button class="button secondary" id="prev" ${data.step===0?'disabled':''}>← 이전</button>${data.step<4?`<button class="button" id="next">다음 단계 →</button>`:`<div><button class="button secondary" id="print">🖨 인쇄 / PDF 저장</button> <button class="button" id="download">📄 계획서 내려받기</button></div>`}</div>`;bind();}
function step0(){return `<section class="card"><h2>🏡 1. 우리 모둠의 공간을 선택해요</h2><p>모둠이 맡을 가게나 시설을 선택하세요. '도서관'은 선생님이 함께 보여주는 시범 공간이에요.</p><label for="team">모둠 이름</label><input id="team" placeholder="예: 1모둠" value="${esc(data.team)}"><div class="grid" style="margin-top:18px">${shops.map(s=>`<button class="shop ${data.shop===s.id?'selected':''}" data-shop="${s.id}"><span class="emoji">${s.icon}</span><strong>${s.name}</strong>${s.id==='demo'?'<span class="muted">선생님 시범</span>':''}</button>`).join('')}</div><p class="note">모둠마다 서로 다른 공간을 맡을 수 있도록 선생님과 미리 정해도 좋아요.</p></section>`}
function step1(){const s=shop();if(!s)return '<section class="card">먼저 공간을 선택해 주세요.</section>';let n=s.words.filter(w=>(data.meanings[w]||'').trim()).length;return `<section class="card"><h2>${s.icon} 2. ${esc(s.name)}에 어울리는 고유어 조사</h2><p>국립국어원 사전에서 <b>아래 모든 단어</b>의 뜻을 찾아 적어 보세요. 뜻이 여러 개라면 우리 공간에서 사용할 의미를 중심으로 기록해요.</p><button class="button secondary" id="dictionary">🔎 국립국어원 우리말샘 열기 ↗</button><p class="pill">${n} / ${s.words.length}개 조사 완료</p>${s.words.map((w,i)=>`<div class="word"><h3><span class="label-num">${i+1}</span> ${esc(w)}</h3><label for="mean-${i}">사전에서 찾은 뜻</label><textarea id="mean-${i}" data-meaning="${esc(w)}" placeholder="국어사전의 뜻을 확인하여 적으세요.">${esc(data.meanings[w]||'')}</textarea><label for="example-${i}">활용 사례 또는 사전에 나온 용례 (선택)</label><input id="example-${i}" data-example="${esc(w)}" value="${esc(data.examples[w]||'')}" placeholder="예: 어떤 상황에서 쓰이는 말인가요?"></div>`).join('')}</section>`}
function step2(){const s=shop();if(!s)return '<section class="card">공간을 먼저 선택하세요.</section>';const roles=['가게·시설 이름','홍보 문구 / 상품·서비스 이름','공간 소개 문장'];return `<section class="card"><h2>✨ 3. 홍보지에 쓸 고유어 선택</h2><p>조사한 단어에서 <b>서로 다른 고유어 3개</b>를 골라 역할을 정하고, 왜 선택했는지 작성해요.</p><div class="sample">🌱 선생님 시범: 도서관의 이름은 <b>나래</b>, 홍보 문구에는 <b>꿈</b>, 소개 문장에는 <b>이야기</b>를 활용할 수 있어요.</div>${roles.map((r,i)=>`<div class="planrow"><h3>${i+1}. ${r}</h3><label>선택할 고유어</label><select data-choice="${i}"><option value="">선택하세요</option>${s.words.map(w=>`<option value="${esc(w)}" ${data.choices[i]===w?'selected':''}>${esc(w)}</option>`).join('')}</select><p class="note" id="meaning-${i}">${data.choices[i]?'조사한 뜻: '+esc(data.meanings[data.choices[i]]||'미입력'):''}</p><label>선택 이유</label><textarea data-reason="${i}" placeholder="이 고유어가 우리 공간과 어울리는 이유는 무엇인가요?">${esc(data.reasons[i])}</textarea></div>`).join('')}</section>`}
function step3(){let role=['① 가게·시설 이름','② 홍보 문구 또는 상품·서비스 이름','③ 공간 소개 문장'];return `<section class="card"><h2>🎨 4. 홍보 전단지를 계획해요</h2><p>고유어를 <b>실제로 어떻게 표현할지</b> 문장을 완성하고, 고유어의 뜻을 이해하는 데 도움이 되는 그림을 생각해 보세요.</p>${role.map((r,i)=>`<div class="planrow"><h3>${r}</h3><p>선택한 단어: <b>${esc(data.choices[i]||'미선택')}</b></p><p class="note">선택 이유: ${esc(data.reasons[i]||'미작성')}</p><label>전단지에 실제로 넣을 표현</label><textarea data-use="${i}" placeholder="전단지에 들어갈 이름 또는 문장을 완성하세요.">${esc(data.uses[i])}</textarea></div>`).join('')}<div class="planrow"><h3>🖼 그림·사진 계획</h3><label>어떤 그림이나 사진을 넣을까요?</label><textarea id="picture" placeholder="예: 날개 달린 책과 밝은 햇빛">${esc(data.picture)}</textarea><label>어떤 고유어의 뜻을 보여 주나요?</label><textarea id="pictureReason" placeholder="그림이 고유어의 의미를 이해하는 데 어떻게 도움을 주나요?">${esc(data.pictureReason)}</textarea></div><div class="warn">💡 다음 차시 캔바 전단지에는 이름, 홍보 문구, 공간 소개, 고유어 3개의 뜻, 그림·사진을 넣는 것을 추천해요.</div></section>`}
function step4(){const s=shop();return `<section class="card"><h2>✅ 5. 우리 모둠의 계획서 확인</h2><p>내용을 확인하고 내려받아 캔바를 보면서 제작해 보세요. 전단지에는 선택한 고유어의 뜻도 꼭 포함하세요.</p><div class="result"><p class="muted">6-4 골목거리 · ${esc(data.team||'모둠명 미입력')} · ${esc(s?.name||'공간 미선택')}</p><h2>${esc(data.uses[0]||'가게 이름을 적으세요')}</h2><p class="slogan">${esc(data.uses[1]||'홍보 문구를 적으세요')}</p><div class="illustration">🖼 ${esc(data.picture||'그림 계획 미작성')}</div><div class="blurb"><h3>우리 공간을 소개해요</h3><p>${esc(data.uses[2]||'공간 소개 미작성')}</p><h3>전단지 속 고유어 알아보기</h3>${data.choices.map(w=>`<p><b>${esc(w||'(미선택)')}</b> — ${esc(data.meanings[w]||'뜻 미작성')}</p>`).join('')}<h3>고유어 선택 이유</h3>${data.choices.map((w,i)=>`<p>${i+1}. <b>${esc(w)}</b>: ${esc(data.reasons[i]||'미작성')}</p>`).join('')}<h3>그림과 고유어의 연결</h3><p>${esc(data.pictureReason||'미작성')}</p></div></div><p class="note">이 계획서는 실제 홍보 전단지의 완성품이 아니라 캔바에서 제작할 때 참고할 학습 결과물입니다.</p></section>`}
function bind(){const prev=document.getElementById('prev');if(prev)prev.onclick=()=>setStep(data.step-1);const next=document.getElementById('next');if(next)next.onclick=()=>{if(!canNext()){alert(['공간을 선택해 주세요.','제시된 고유어의 뜻을 모두 조사해 주세요.','서로 다른 단어 3개와 선택 이유를 모두 작성해 주세요.','홍보 표현과 그림 계획을 모두 적어 주세요.'][data.step]);return}setStep(data.step+1)};document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{data.shop=b.dataset.shop;data.choices=['','',''];data.reasons=['','',''];data.uses=['','',''];save();render()});const t=document.getElementById('team');if(t)t.oninput=e=>field('team',e.target.value);const dictionary=document.getElementById('dictionary');if(dictionary)dictionary.onclick=dict;document.querySelectorAll('[data-meaning]').forEach(el=>el.oninput=e=>{data.meanings[el.dataset.meaning]=e.target.value;save()});document.querySelectorAll('[data-example]').forEach(el=>el.oninput=e=>{data.examples[el.dataset.example]=e.target.value;save()});document.querySelectorAll('[data-choice]').forEach(el=>el.onchange=e=>{data.choices[+el.dataset.choice]=e.target.value;save();render()});document.querySelectorAll('[data-reason]').forEach(el=>el.oninput=e=>{data.reasons[+el.dataset.reason]=e.target.value;save()});document.querySelectorAll('[data-use]').forEach(el=>el.oninput=e=>{data.uses[+el.dataset.use]=e.target.value;save()});for(const name of ['picture','pictureReason']){const el=document.getElementById(name);if(el)el.oninput=e=>field(name,e.target.value)}const pr=document.getElementById('print');if(pr)pr.onclick=()=>window.print();const dl=document.getElementById('download');if(dl)dl.onclick=download}
function download(){const s=shop();let txt=`6-4 골목거리 고유어 조사 및 홍보 전단지 계획서\n모둠: ${data.team}\n공간: ${s?.name||''}\n\n[조사한 고유어]\n${s?.words.map(w=>`${w}: ${data.meanings[w]||''}\n활용 사례: ${data.examples[w]||''}`).join('\n')||''}\n\n[선택 및 활용 계획]\n${data.choices.map((w,i)=>`${i+1}. ${w}\n선택 이유: ${data.reasons[i]}\n활용 표현: ${data.uses[i]}`).join('\n\n')}\n\n그림·사진: ${data.picture}\n그림 선택 이유: ${data.pictureReason}`;const blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`6-4골목거리_${data.team||'모둠'}_계획서.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();
</script></body></html>
